<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283b"><meta name="description" content="積立投資の将来資産を試算するオフライン対応アプリ"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>つみたて計算機</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#091825;color:#eef5fa}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:24px 18px 70px}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{background:#1dba9a;border-radius:15px;padding:12px;font-size:25px}h1{font-size:24px;margin:0}header p{margin:4px 0 0;color:#a9c0d0;font-size:12px}.panel{background:#11293b;border:1px solid #274458;border-radius:20px;padding:20px;margin-bottom:16px}h2{font-size:17px;margin:0 0 18px}.field{margin:16px 0}label{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:9px;color:#c6d9e4}label output{font-weight:700;color:#fff;font-size:18px}input[type=range]{width:100%;accent-color:#2dd5b1}input[type=number]{width:100%;border:1px solid #426075;background:#0b2030;color:white;padding:12px;border-radius:10px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#0b2030;border-radius:14px;padding:14px}.metric small{color:#a8bdca}.metric strong{display:block;font-size:20px;margin-top:7px}.hero{background:linear-gradient(125deg,#145d60,#16446a);padding:20px;border-radius:16px;margin-bottom:12px}.hero small{color:#c5e9e5}.hero strong{display:block;font-size:34px;margin-top:8px}.green{color:#4ce0b8}.muted{color:#a9bdc9;font-size:12px;line-height:1.7}.chart{width:100%;height:auto;display:block}.legend{display:flex;gap:16px;font-size:12px;color:#bdd0dc}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.actions{display:flex;gap:10px;margin-top:16px}button{border:0;background:#2bd3ae;color:#062a29;border-radius:12px;padding:12px 16px;font-weight:750;cursor:pointer}button.secondary{background:#244458;color:#e5f4f8}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:10px 4px;border-bottom:1px solid #284357}td:first-child,th:first-child{text-align:left}footer{font-size:12px;color:#a9bdc9;line-height:1.8}#install{display:none}@media(max-width:390px){.hero strong{font-size:28px}.metric strong{font-size:17px}main{padding:16px 12px 60px}}
</style></head><body><main><header><div class="logo">📈</div><div><h1>つみたて計算機</h1><p>未来のお金を、手のひらで。</p></div></header><section class="panel"><h2>積立プラン</h2><div class="field"><label for="monthly">毎月の積立額 <output id="monthlyOut"></output></label><input id="monthly" type="range" min="1000" max="50000" step="1000"></div><div class="field"><label for="years">積立期間 <output id="yearsOut"></output></label><input id="years" type="range" min="1" max="40" step="1"></div><div class="field"><label for="rate">想定年利 <output id="rateOut"></output></label><input id="rate" type="range" min="0" max="10" step="0.5"></div><div class="actions"><button class="secondary" id="reset">初期値に戻す</button><button id="install">アプリをインストール</button></div><p class="muted">入力内容はこの端末に自動保存されます。</p></section><section class="panel"><h2>シミュレーション結果</h2><div class="hero"><small>将来の想定資産額</small><strong id="total"></strong></div><div class="grid"><div class="metric"><small>積立元本</small><strong id="principal"></strong></div><div class="metric"><small>想定運用益</small><strong class="green" id="gain"></strong></div></div></section><section class="panel"><h2>資産推移</h2><svg id="chart" class="chart" viewBox="0 0 600 300" role="img" aria-label="積立元本と想定資産額の推移"></svg><div class="legend"><span><i class="dot" style="background:#6d9ac4"></i>積立元本</span><span><i class="dot" style="background:#38d8b2"></i>想定資産額</span></div></section><section class="panel"><h2>年ごとの内訳</h2><table><thead><tr><th>年数</th><th>積立元本</th><th>想定資産額</th></tr></thead><tbody id="rows"></tbody></table></section><footer>※毎月末に積み立て、年利を12で割った月利で複利計算した概算です。税金・手数料・インフレは考慮していません。実際の運用成果は変動し、元本割れする場合があります。<br>※こどもNISAの制度上限や引出条件を自動判定するものではありません。</footer></main><script>
const defaults={monthly:10000,years:18,rate:5};let saved={};try{saved=JSON.parse(localStorage.getItem('tsumitate-settings')||'{}')}catch{};const $=id=>document.getElementById(id),yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';for(const key of Object.keys(defaults)){const e=$(key),v=Number(saved[key]);e.value=Number.isFinite(v)&&v>=Number(e.min)&&v<=Number(e.max)?v:defaults[key];e.addEventListener('input',update)}function calc(m,y,rate){const n=y*12,r=rate/1200;return r===0?m*n:m*(Math.pow(1+r,n)-1)/r}function update(){const monthly=+$('monthly').value,years=+$('years').value,rate=+$('rate').value;const data={monthly,years,rate};try{localStorage.setItem('tsumitate-settings',JSON.stringify(data))}catch{};$('monthlyOut').textContent=yen(monthly);$('yearsOut').textContent=years+'年';$('rateOut').textContent=rate.toFixed(1)+'%';const principal=monthly*years*12,total=calc(monthly,years,rate);$('principal').textContent=yen(principal);$('total').textContent=yen(total);$('gain').textContent='+'+yen(total-principal);const pts=Array.from({length:years+1},(_,i)=>({year:i,p:monthly*12*i,t:calc(monthly,i,rate)}));draw(pts);$('rows').innerHTML=pts.slice(1).map(p=>`<tr><td>${p.year}年</td><td>${yen(p.p)}</td><td>${yen(p.t)}</td></tr>`).join('')}function draw(pts){const svg=$('chart'),max=Math.max(pts.at(-1).t,1)*1.1,W=600,H=300,left=65,right=15,top=18,bottom=40,x=i=>left+i/(pts.length-1)*(W-left-right),y=v=>H-bottom-v/max*(H-top-bottom);const line=key=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p[key]).toFixed(1)).join(' ');let s='';for(let i=0;i<=4;i++){const v=max*i/4,Y=y(v);s+=`<line x1="${left}" y1="${Y}" x2="${W-right}" y2="${Y}" stroke="#355267" stroke-dasharray="3 5"/><text x="${left-8}" y="${Y+4}" fill="#adc1d0" font-size="12" text-anchor="end">${(v/10000).toFixed(0)}万</text>`}s+=`<path d="${line('p')}" stroke="#6d9ac4" stroke-width="3" fill="none"/><path d="${line('t')}" stroke="#38d8b2" stroke-width="4" fill="none"/>`;for(const i of [0,Math.floor((pts.length-1)/2),pts.length-1])s+=`<text x="${x(i)}" y="${H-12}" fill="#adc1d0" font-size="13" text-anchor="middle">${i}年</text>`;svg.innerHTML=s} $('reset').onclick=()=>{for(const k in defaults)$(k).value=defaults[k];update()};update();let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').style.display='block'});$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').style.display='none'}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
